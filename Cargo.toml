[package]
name = "arkeology-synth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-queue = "0.3.14"
dirs = "7.0.0"
hound = "3.5.1"
midir = "0.11.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Unoptimised DSP can't keep up in real time; keep `cargo run` usable.
[profile.dev]
opt-level = 2
